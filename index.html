<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apresentação Pessoal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #e5e5e5;
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 560px;
      margin: 24px 16px;
      padding: 40px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    h1 {
      margin: 0 0 24px;
      padding-bottom: 12px;
      color: #ffffff;
      border-bottom: 2px solid #555;
    }
    h2 {
      margin-top: 32px;
      color: #bdbdbd;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    strong { color: #ffffff; }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; }
    .aviso {
      margin-top: 32px;
      padding: 12px 16px;
      background: #262626;
      border-left: 4px solid #888;
      border-radius: 4px;
      color: #aaa;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Apresentação Pessoal</h1>
    <p><strong>Nome:</strong> Ibson</p>
    <p><strong>Curso:</strong> Engenharia de Software</p>

    <h2>O que pretendo aprender</h2>
    <ul>
      <li>Programação</li>
      <li>Trabalhar com projetos</li>
      <li>Redes</li>
    </ul>

    <p class="aviso">Esta página é um teste de HTML.</p>
  </div>
</body>
</html>
